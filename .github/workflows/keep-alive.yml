name: keep-alive

# Keeps the free services awake so nobody waits for a cold start:
# - Render puts the API to sleep after 15 minutes without requests, and waking it
#   takes about 50 seconds; a call every 10 minutes keeps it running.
# - Supabase pauses a project after about 7 days without activity; /health/db runs
#   a query, so the database never goes idle.
# One instance running all month is about 744 hours, inside Render's 750 free hours
# (as long as this is the only free service of the workspace).
# GitHub may delay scheduled runs by a few minutes when it is busy.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Never two pings at the same time if one is slow.
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      API_URL: https://pixelforge-api-mmo6.onrender.com
    steps:
      - name: Call /health/db (retry while Render wakes up)
        run: |
          for attempt in $(seq 1 6); do
            status=$(curl -s -o body.txt -w "%{http_code}" --max-time 60 "$API_URL/health/db" || echo 000)
            echo "attempt $attempt: HTTP $status $(head -c 200 body.txt 2>/dev/null)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::$API_URL/health/db did not answer 200. Check whether the Supabase project is paused."
          exit 1
